name: Build Debug APK and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -euo pipefail
          echo "Checking Java runtime..."
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"

          if [ -z "${JAVA_HOME:-}" ]; then
            echo "::error::JAVA_HOME is not set. Java environment detection failed."
            exit 1
          fi

          JAVA_VER_LINE="$(java -version 2>&1 | head -n 1 || true)"
          if [ -z "${JAVA_VER_LINE}" ]; then
            echo "::error::Unable to detect active Java version output."
            exit 1
          fi

          RAW_VERSION="$(echo "${JAVA_VER_LINE}" | sed -E 's/.*version "([^"]+)".*/\1/')"
          if [ -z "${RAW_VERSION}" ] || [ "${RAW_VERSION}" = "${JAVA_VER_LINE}" ]; then
            echo "::error::Could not parse active Java version from: ${JAVA_VER_LINE}"
            exit 1
          fi

          if [[ "${RAW_VERSION}" == 1.* ]]; then
            MAJOR_VERSION="$(echo "${RAW_VERSION}" | cut -d'.' -f2)"
          else
            MAJOR_VERSION="$(echo "${RAW_VERSION}" | cut -d'.' -f1 | cut -d'-' -f1)"
          fi

          if ! [[ "${MAJOR_VERSION}" =~ ^[0-9]+$ ]]; then
            echo "::error::Detected Java major version is not numeric: ${MAJOR_VERSION}"
            exit 1
          fi

          echo "Detected Java major version: ${MAJOR_VERSION}"
          if [ "${MAJOR_VERSION}" -lt 17 ]; then
            echo "::error::Active Java major version (${MAJOR_VERSION}) is lower than 17. Java 17 or newer is required."
            exit 1
          fi
          echo "Java environment verified successfully (Java ${MAJOR_VERSION})."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          KEYSTORE_FILE="./debug.keystore"
          if [ -f "${KEYSTORE_FILE}" ]; then
            echo "Temporary debug keystore already exists at ${KEYSTORE_FILE}."
          else
            echo "Generating temporary debug keystore at ${KEYSTORE_FILE}..."
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [ ! -x "${KEYTOOL_BIN}" ]; then
              KEYTOOL_BIN="keytool"
            fi

            "${KEYTOOL_BIN}" -genkeypair -v \
              -keystore "${KEYSTORE_FILE}" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "${KEYSTORE_FILE}" ] || [ ! -s "${KEYSTORE_FILE}" ]; then
            echo "::error::Failed to create temporary debug keystore at ${KEYSTORE_FILE}."
            exit 1
          fi
          echo "Confirmed ./debug.keystore exists."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -e "${EXPECTED_APK}" ]; then
            echo "::error::Expected debug APK not found at ${EXPECTED_APK}."
            echo "Searching inside app/build/outputs/apk for diagnostic purposes:"
            if [ -d "app/build/outputs/apk" ]; then
              find "app/build/outputs/apk" -type f -name "*.apk" -print || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "::error::${EXPECTED_APK} exists but is not a regular file."
            exit 1
          fi

          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "::error::${EXPECTED_APK} is empty (0 bytes)."
            exit 1
          fi

          case "${EXPECTED_APK}" in
            *.apk) ;;
            *)
              echo "::error::Selected file does not have a .apk extension: ${EXPECTED_APK}"
              exit 1
              ;;
          esac

          if [ "${EXPECTED_APK}" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::Selected APK path does not match app/build/outputs/apk/debug/app-debug.apk."
            exit 1
          fi

          APK_SIZE="$(wc -c < "${EXPECTED_APK}" | tr -d ' ')"
          echo "Verified debug APK: ${EXPECTED_APK} (${APK_SIZE} bytes)."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -euo pipefail
          VERIFIED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "${VERIFIED_APK}" ] || [ ! -s "${VERIFIED_APK}" ]; then
            echo "::error::Verified debug APK is missing or empty at ${VERIFIED_APK}."
            exit 1
          fi

          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME="$(echo "${RAW_REPO_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          if [ -z "${SAFE_REPO_NAME}" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          RELEASE_ASSET_DIR="$(mktemp -d "${RUNNER_TEMP}/apk-release-asset.XXXXXX")"
          ASSET_PATH="${RELEASE_ASSET_DIR}/${ASSET_FILENAME}"

          cp "${VERIFIED_APK}" "${ASSET_PATH}"

          if [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "::error::Failed to prepare APK release asset at ${ASSET_PATH}."
            exit 1
          fi

          echo "Prepared release asset: ${ASSET_FILENAME}"
          echo "asset_path=${ASSET_PATH}" >> "${GITHUB_OUTPUT}"
          echo "asset_name=${ASSET_FILENAME}" >> "${GITHUB_OUTPUT}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          set -euo pipefail

          echo "Verifying GitHub CLI availability..."
          gh --version

          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "${ASSET_PATH}" ]; then
            echo "::error::Prepared release asset does not exist at ${ASSET_PATH:-<empty>}."
            exit 1
          fi

          if [ ! -s "${ASSET_PATH}" ]; then
            echo "::error::Prepared release asset is empty: ${ASSET_PATH}."
            exit 1
          fi

          case "${ASSET_PATH}" in
            *.apk) ;;
            *)
              echo "::error::Prepared release asset is not a .apk file: ${ASSET_PATH}"
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "release_title=${RELEASE_TITLE}" >> "${GITHUB_OUTPUT}"

          NOTES_FILE="$(mktemp "${RUNNER_TEMP}/release-notes.XXXXXX.md")"
          cat <<EOF > "${NOTES_FILE}"
          ### Automated Debug APK Build

          - **Build Type:** Automatically generated debug APK
          - **Built By:** GitHub Actions
          - **Workflow Run Number:** \`${GITHUB_RUN_NUMBER}\`
          - **Workflow Run Attempt:** \`${GITHUB_RUN_ATTEMPT}\`
          - **Source Commit SHA:** \`${GITHUB_SHA}\`
          - **Intended Use:** Testing and verification on Android devices
          - **Production Status:** This APK is **not** a Play Store production release
          - **Signing Info:** Signed only with a temporary debug keystore generated during the CI run

          #### Download Instructions
          Download **\`${ASSET_NAME}\`** directly from the **Assets** section below to install on your phone.
          EOF

          gh release create "${RELEASE_TAG}" "${ASSET_PATH}#${ASSET_NAME}" \
            --title "${RELEASE_TITLE}" \
            --notes-file "${NOTES_FILE}" \
            --target "${GITHUB_SHA}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_TAG: debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}
          RELEASE_TITLE: Debug APK Build #${{ github.run_number }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          set -euo pipefail

          if [ "${PUBLISH_OUTCOME}" = "success" ]; then
            if RELEASE_URL="$(gh release view "${RELEASE_TAG}" --json url --jq '.url' 2>/dev/null)" && [ -n "${RELEASE_URL}" ]; then
              echo "=========================================="
              echo "GitHub Release Published Successfully"
              echo "Release Tag:   ${RELEASE_TAG}"
              echo "Release Title: ${RELEASE_TITLE}"
              echo "Release URL:   ${RELEASE_URL}"
              echo "APK Asset:     ${ASSET_NAME}"
              echo "=========================================="

              {
                echo "## Debug APK Build & Release Summary"
                echo ""
                echo "- **APK Build Status:** Succeeded (\`app/build/outputs/apk/debug/app-debug.apk\`)"
                echo "- **Actions Artifact:** \`app-debug-apk\` (uploaded and available as a backup)"
                echo "- **GitHub Release Status:** Published (marked as Latest)"
                echo "- **Release Title:** ${RELEASE_TITLE}"
                echo "- **Release Tag:** \`${RELEASE_TAG}\`"
                echo "- **APK Asset Filename:** \`${ASSET_NAME}\`"
                echo "- **Direct GitHub Release Page:** [Download from Release Assets](${RELEASE_URL})"
                echo ""
                echo "You can download **\`${ASSET_NAME}\`** directly from the **Assets** section on the [GitHub Release page](${RELEASE_URL}), or download the **\`app-debug-apk\`** artifact from this workflow run summary as a backup."
              } >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
          fi

          echo "::warning::GitHub Release publishing did not succeed, but the debug APK build and Actions artifact upload succeeded."
          echo "APK Build Status: Succeeded (app/build/outputs/apk/debug/app-debug.apk)"
          echo "Backup Download: The GitHub Actions artifact named 'app-debug-apk' remains available for download from this workflow run."

          {
            echo "## Debug APK Build & Release Summary"
            echo ""
            echo "> **Warning:** Publishing to GitHub Releases failed or was skipped, but your debug APK was built and preserved."
            echo ""
            echo "- **APK Build Status:** Succeeded (\`app/build/outputs/apk/debug/app-debug.apk\`)"
            echo "- **Actions Artifact:** \`app-debug-apk\` remains available for download"
            echo "- **GitHub Release Status:** Failed (see step logs for details)"
            echo ""
            echo "### How to Download Your APK"
            echo "Open the **Summary** tab of this GitHub Actions workflow run and download the **\`app-debug-apk\`** artifact from the **Artifacts** section."
          } >> "${GITHUB_STEP_SUMMARY}"
